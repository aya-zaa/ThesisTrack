<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../assets-css/student.css" />
    <title>ThesisTrack - Files</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body class="projects-page">
    <div class="supervisor-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="logo"><i class="fa fa-graduation-cap"></i> ThesisTrack</h2>

        <ul class="menu">
          <li onclick="location.href = 'dashboard-student.html'">
            <i class="fa fa-home"></i><span>Dashboard</span>
          </li>
          <li class="active" onclick="location.href = 'files-student.html'">
            <i class="fa fa-folder"></i><span>Files</span>
          </li>

          <li onclick="location.href = 'tasks.html'">
            <i class="fa fa-check"></i><span>Tasks</span>
          </li>

          <li onclick="location.href = 'search.html'">
            <i class="fa fa-user-tie"></i><span>Supervisor Search</span>
          </li>
          <li onclick="location.href = 'message.html'">
            <i class="fa fa-envelope"></i><span>Messages</span>
          </li>

          <li onclick="location.href = 'Notifications-student.html'">
            <i class="fa fa-bell"></i><span>Notifications</span>
          </li>
          <li onclick="location.href = 'profile-student.html'">
            <i class="fa fa-user"></i><span>Profile</span>
          </li>
        </ul>
      </aside>
      <!-- MAIN -->
      <main class="main-content">
        <header class="topbar">
          <div>
            <h2>Files</h2>
            <p class="sub">Manage and submit your thesis documents</p>
          </div>

          <button class="add-btn" id="open-modal-btn">Upload File</button>
        </header>

        <!-- SEARCH + FILTER -->
        <div class="file-controls">
          <input id="search" placeholder="Search files..." />

          <div class="filters">
            <button onclick="filterFiles('all')">All</button>
            <button onclick="filterFiles('not-sent')">Not Sent</button>
            <button onclick="filterFiles('sent')">Sent</button>
            <button onclick="filterFiles('reviewed')">Reviewed</button>
            <button onclick="filterFiles('approved')">Approved</button>
          </div>
        </div>

        <!-- GRID -->
        <div id="files-container" class="files-grid"></div>
      </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h3>Upload New File</h3>

        <form
          action="../api/upload_file.php"
          method="POST"
          enctype="multipart/form-data"
        >
          <input type="file" name="file" required />

          <input type="text" name="title" placeholder="File title" required />

          <textarea name="notes" placeholder="Notes..."></textarea>

          <label>
            <input type="checkbox" name="send_now" />
            Send to supervisor
          </label>

          <button type="submit">Upload</button>
        </form>
      </div>
    </div>

    <!-- DELETE CONFIRM MODAL -->
    <div id="delete-modal" class="modal hidden">
      <div class="modal-box">
        <h3>Delete File</h3>
        <p>Are you sure you want to delete this file?</p>

        <div class="modal-actions">
          <button id="confirm-delete">Yes, Delete</button>
          <button onclick="closeDeleteModal()">Cancel</button>
        </div>
      </div>
    </div>
    <script src="../assets-js/student.js"></script>
  </body>
</html>
