<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets-css/prof.css" />
  </head>
  <body class="dashboard-prof">
    <div class="supervisor-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="logo"><i class="fa fa-graduation-cap"></i> ThesisTrack</h2>

        <ul class="menu">
          <li class="active" onclick="location.href = 'Dashboard-prof.html'">
            <i class="fa fa-home"></i><span>Dashboard</span>
          </li>

          <li onclick="location.href = 'projects.html'">
            <i class="fa fa-folder"></i><span>Projects</span>
          </li>

          <li onclick="location.href = 'files-prof.html'">
            <i class="fa fa-folder"></i><span>Files</span>
          </li>

          <li onclick="location.href = 'reviews.html'">
            <i class="fa fa-check"></i><span>Reviews</span>
          </li>

          <li onclick="location.href = 'message-prof.html'">
            <i class="fa fa-envelope"></i><span>Messages</span>
          </li>

          <li onclick="location.href = 'notifications.html'">
            <i class="fa fa-bell"></i><span>Notifications</span>
          </li>

          <li onclick="location.href = 'profile-prof.html'">
            <i class="fa fa-user"></i><span>Profile</span>
          </li>
        </ul>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        <!-- HEADER -->
        <header class="topbar">
          <div class="user">
            <span id="userName"></span>
          </div>
        </header>

        <!-- CARD -->
        <div class="card">
          <div>
            <p class="small">SUPERVISOR DASHBOARD</p>
            <h2 id="profName"></h2>
            <p id="dept"></p>

            <div class="badges">
              <span id="progressCount"></span>
              <span id="reviewedCount"></span>
              <span id="completedCount"></span>
            </div>
          </div>

          <div class="projectsNumber">
            <h1 id="totalProjects"></h1>
            <p>Projects</p>
          </div>
        </div>

        <!-- CONTENT -->
        <div class="content">
          <!-- LEFT -->
          <div class="left">
            <h3>Student Projects</h3>
            <div id="projectsList"></div>
          </div>

          <!-- RIGHT -->
          <div class="right">
            <div class="box">
              <h3>Recent Files</h3>
              <div id="filesList"></div>
            </div>

            <div class="box">
              <h3>Notifications</h3>
              <div id="notifList"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../assets-js/prof.js"></script>
  </body>
</html>
