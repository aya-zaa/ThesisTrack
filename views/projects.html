<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Projects</title>
    <link rel="stylesheet" href="../assets-css/prof.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="projects-page">
    <div class="supervisor-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="logo"><i class="fa fa-graduation-cap"></i> ThesisTrack</h2>

        <ul class="menu">
          <li onclick="location.href = 'Dashboard-prof.html'">
            <i class="fa fa-home"></i><span>Dashboard</span>
          </li>

          <li class="active" onclick="location.href = 'projects.html'">
            <i class="fa fa-folder"></i><span>Projects</span>
          </li>

          <li onclick="location.href = 'files-prof.html'">
            <i class="fa fa-folder"></i><span>Files</span>
          </li>

          <li onclick="location.href = 'reviews.html'">
            <i class="fa fa-check"></i><span>Reviews</span>
          </li>

          <li onclick="location.href = 'message-prof.html'">
            <i class="fa fa-envelope"></i><span>Messages</span>
          </li>

          <li onclick="location.href = 'notifications.html'">
            <i class="fa fa-bell"></i><span>Notifications</span>
          </li>

          <li onclick="location.href = 'profile-prof.html'">
            <i class="fa fa-user"></i><span>Profile</span>
          </li>
        </ul>
      </aside>
      <!-- MAIN -->
      <main class="main-content">
        <header class="topbar">
          <h2>Projects</h2>

          <div class="top-actions">
            <button class="add-btn" onclick="clearAll()">Clear All</button>
            <button class="add-btn" id="open-modal-btn">+ Add</button>
          </div>
        </header>

        <!-- STATS -->
        <div class="stats">
          <div class="stat-box">
            <h3 id="total-count">0</h3>
            <p>Total Projects</p>
          </div>

          <div class="stat-box">
            <h3 id="progress-count">0</h3>
            <p>In Progress</p>
          </div>

          <div class="stat-box">
            <h3 id="reviewed-count">0</h3>
            <p>Reviewed</p>
          </div>

          <div class="stat-box">
            <h3 id="completed-count">0</h3>
            <p>Completed</p>
          </div>
        </div>

        <!-- PROJECT LIST -->
        <div id="projects-container"></div>

        <!-- EMPTY -->
        <div id="empty-state" class="empty-box">
          <p>No projects added yet.</p>
        </div>
      </main>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h3>Create Project</h3>

        <form id="project-form">
          <input type="text" id="project-title" placeholder="Project Title" />

          <div id="students-list">
            <div class="student-row">
              <input
                type="text"
                placeholder="Student Name"
                class="student-name"
              />
              <input
                type="email"
                placeholder="Student Email"
                class="student-email"
              />
            </div>
          </div>

          
          <select id="project-status">
            <option value="in-progress">In Progress</option>
            <option value="reviewed">Reviewed</option>
            <option value="completed">Completed</option>
          </select>

          <div class="modal-actions">
            <button
              type="button"
              class="add-student-btn"
              onclick="addStudent()"
            >
              + Add Student
            </button>

            <div class="right-buttons">
              <button type="submit" class="primary-btn">Add</button>
              <button
                type="button"
                class="secondary-btn"
                onclick="closeModal()"
              >
                Close
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <!-- DELETE CONFIRM MODAL -->
    <div id="delete-modal" class="modal hidden">
      <div class="confirm-box">
        <h3 class="confirm-title">Delete Project</h3>

        <p class="confirm-text">
          Are you sure you want to delete this project?
        </p>

        <div class="confirm-actions">
          <button id="confirm-delete" class="danger-btn">Yes, Delete</button>
          <button onclick="closeDeleteModal()" class="cancel-btn">
            Cancel
          </button>
        </div>
      </div>
    </div>
    <script src="../assets-js/prof.js" defer></script>
  </body>
</html>
