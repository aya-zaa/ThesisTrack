<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project Details</title>
    <link rel="stylesheet" href="../assets-css/prof.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="projects-page">
    <div class="supervisor-layout">
      <aside class="sidebar">
        <h2 class="logo"><i class="fa fa-graduation-cap"></i> ThesisTrack</h2>

        <ul class="menu">
          <li onclick="location.href = 'Dashboard-prof.html'">
            <i class="fa fa-home"></i><span>Dashboard</span>
          </li>
          <li class="active" onclick="location.href = 'projects.html'">
            <i class="fa fa-folder"></i><span>Projects</span>
          </li>

          <li onclick="location.href = 'files-prof.html'">
            <i class="fa fa-folder"></i><span>Files</span>
          </li>

          <li onclick="location.href = 'reviews.html'">
            <i class="fa fa-check"></i><span>Reviews</span>
          </li>

          <li onclick="location.href = 'message-prof.html'">
            <i class="fa fa-envelope"></i><span>Messages</span>
          </li>

          <li onclick="location.href = 'notifications.html'">
            <i class="fa fa-bell"></i><span>Notifications</span>
          </li>

          <li onclick="location.href = 'profile-prof.html'">
            <i class="fa fa-user"></i><span>Profile</span>
          </li>
        </ul>
      </aside>

      <main class="main-content">
        <div class="back-link" onclick="goBackToProjects()">
          <i class="fa fa-arrow-left"></i> Back to Projects
        </div>
        <div class="project-header">
          <div>
            <span class="project-label">CURRENT PROJECT</span>
            <h2 id="project-title"></h2>
            <p id="students"></p>
          </div>

          <span class="status-badge" id="project-status">In Progress</span>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-top: 15px">
          <button class="add-btn" onclick="openTaskModal()">+ Add Task</button>
        </div>

        <h3 style="margin-top: 20px">Files</h3>

        <div id="files-container" class="files-list"></div>
        <h3 style="margin-top: 30px">Tasks</h3>

        <div id="tasks-container" class="files-list"></div>
      </main>
    </div>
    <div id="task-modal" class="modal hidden">
      <div class="modal-box">
        <h3>Add Task</h3>

        <input type="text" id="task-title" placeholder="Task Title" />
        <input type="date" id="task-deadline" />
        <textarea
          id="task-notes"
          placeholder="Task details / notes..."
        ></textarea>

        <div class="modal-actions">
          <button class="primary-btn" onclick="addTask()">Add</button>
          <button class="secondary-btn" onclick="closeTaskModal()">
            Cancel
          </button>
        </div>
      </div>
    </div>
    <script src="../assets-js/prof.js"></script>
  </body>
</html>
