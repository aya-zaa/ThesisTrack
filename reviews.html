<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reviews</title>
    <link rel="stylesheet" href="../assets-css/prof.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body class="reviews-page">
    <div class="layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="logo"><i class="fa fa-graduation-cap"></i> ThesisTrack</h2>

        <ul class="menu">
          <li onclick="location.href = 'Dashboard-prof.html'">
            <i class="fa fa-home"></i><span>Dashboard</span>
          </li>

          <li onclick="location.href = 'projects.html'">
            <i class="fa fa-folder"></i><span>Projects</span>
          </li>

          <li onclick="location.href = 'files-prof.html'">
            <i class="fa fa-folder"></i><span>Files</span>
          </li>

          <li class="active">
            <i class="fa fa-check"></i><span>Reviews</span>
          </li>

          <li onclick="location.href = 'message-prof.html'">
            <i class="fa fa-envelope"></i><span>Messages</span>
          </li>

          <li onclick="location.href = 'notifications.html'">
            <i class="fa fa-bell"></i><span>Notifications</span>
          </li>

          <li onclick="location.href = 'profile-prof.html'">
            <i class="fa fa-user"></i><span>Profile</span>
          </li>
        </ul>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        <h1>Reviews</h1>
        <p class="subtitle">All reviewed files with status and feedback</p>

        <!-- FILTER -->
        <div class="filters">
          <button onclick="filterReviews('all')">All</button>
          <button onclick="filterReviews('reviewed')">Reviewed</button>
          <button onclick="filterReviews('approved')">Approved</button>
        </div>

        <!-- LIST -->
        <div id="reviews-container"></div>
      </main>
    </div>

    <script src="../assets-js/prof.js"></script>
  </body>
</html>
