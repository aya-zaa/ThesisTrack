<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Files - Supervisor</title>

    <link rel="stylesheet" href="../assets-css/prof.css" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="projects-page files-prof-page">
    <div class="supervisor-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="logo"><i class="fa fa-graduation-cap"></i> ThesisTrack</h2>

        <ul class="menu">
          <li onclick="location.href = 'Dashboard-prof.html'">
            <i class="fa fa-home"></i><span>Dashboard</span>
          </li>
          <li onclick="location.href = 'projects.html'">
            <i class="fa fa-folder"></i><span>Projects</span>
          </li>

          <li class="active" onclick="location.href = 'files-prof.html'">
            <i class="fa fa-folder"></i><span>Files</span>
          </li>

          <li onclick="location.href = 'reviews.html'">
            <i class="fa fa-check"></i><span>Reviews</span>
          </li>

          <li onclick="location.href = 'message-prof.html'">
            <i class="fa fa-envelope"></i><span>Messages</span>
          </li>

          <li onclick="location.href = 'notifications.html'">
            <i class="fa fa-bell"></i><span>Notifications</span>
          </li>

          <li onclick="location.href = 'profile-prof.html'">
            <i class="fa fa-user"></i><span>Profile</span>
          </li>
        </ul>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        <!-- HEADER -->
        <header class="topbar">
          <h2>Files</h2>
        </header>

        <!-- SEARCH + FILTER -->
        <div class="files-header">
          <input id="search" type="text" placeholder="Search files..." />

          <div class="filters">
            <button onclick="filterFiles('all', event)">All</button>
            <button onclick="filterFiles('sent', event)">Sent</button>
            <button onclick="filterFiles('reviewed', event)">Reviewed</button>
            <button onclick="filterFiles('approved', event)">Approved</button>
          </div>
        </div>

        <!-- FILES LIST -->
        <div id="files-container" class="files-grid"></div>

        <!-- EMPTY STATE -->
        <div id="empty-state" class="empty-box" style="display: none">
          <p>📂 No files yet</p>
        </div>
      </main>
    </div>
    <div id="feedback-modal" class="modal hidden">
      <div class="modal-box">
        <h3>Write Feedback</h3>

        <textarea
          id="feedback-input"
          placeholder="Type your feedback..."
        ></textarea>

        <div class="modal-actions">
          <button class="secondary-btn" onclick="closeFeedback()">
            Cancel
          </button>
          <button class="primary-btn" onclick="submitFeedback()">Send</button>
        </div>
      </div>
    </div>
    <!-- JS -->
    <script src="../assets-js/prof.js"></script>
  </body>
</html>
